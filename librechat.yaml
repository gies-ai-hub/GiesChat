version: 1.3.11
cache: true

interface:
  brainstormRooms: false
  memories: false
  prompts: false
  parameters: false
  bookmarks: false
  agents:
    use: true
    create: true
    share: false
  marketplace:
    use: true
  defaultPinnedTools:
    - mcp
  mcpServers:
    placeholder: MCP
    use: true
    create: true
    share: false
    public: false
    trustCheckbox:
      label:
        en: I understand and want to connect this MCP server
      subLabel:
        en: Only connect MCP servers you trust. MCP tools can send context to external services and may take actions on your behalf.

mcpServers:
  canvas:
    type: stdio
    command: uvx
    args:
      - --from
      - canvas-mcp
      - canvas-mcp-server
    env:
      CANVAS_API_URL: "https://canvas.illinois.edu/api/v1"
      CANVAS_API_TOKEN: "{{CANVAS_API_TOKEN}}"
      UV_CACHE_DIR: /tmp/uv-cache
      UV_TOOL_DIR: /tmp/uv-tools
    title: Canvas MCP
    description: Connect your Illinois Canvas account with your Canvas access token.
    iconPath: "/assets/mcp-canvas.png"
    timeout: 30000
    customUserVars:
      CANVAS_API_TOKEN:
        title: Canvas API Token
        description: Create this in Canvas under Account -> Settings -> New Access Token. This token is stored for your GiesChat user and used only to connect Canvas MCP.
        sensitive: true
  replit:
    type: streamable-http
    url: https://replit-mcp.com/server/mcp
    title: Replit
    description: Build live apps with Replit Agent using your own Replit account.
    iconPath: "/assets/mcp-replit.svg"
    timeout: 120000
    initTimeout: 60000
    serverInstructions: |
      Replit app-builder workflow (follow exactly):
      1. Before building, you MUST ask 2-3 idea-specific brainstorming questions whose answers would most change the app. Ask them ONE AT A TIME, waiting for each answer before choosing the next. Skip details the user already provided. You MUST NOT call create_app_from_prompt until the questions are answered unless the user explicitly asks you to build directly.
      2. Call create_app_from_prompt AT MOST ONCE per requested app. Its result includes structured content with the app's replId and a replUrl. The replUrl is the Replit workspace page - never show it to the user and never put it in an artifact. The build runs in the background for a few minutes.
      3. Only use a replId that came from a tool result. If no tool result showed you the replId, call resolve_app_by_name with the exact app name you created - NEVER guess or invent a replId.
      4. To show the running app inside this chat, call ask_question with the replId asking: "Is the initial build finished? What is the live preview URL of this app - the https://....replit.dev URL where the running app can be viewed? Reply with the build status and the exact URL."
      5. Once you have the replit.dev URL, include this directive in your reply (replace APP NAME and the URL; keep the code fence):
      :::artifact{identifier="replit-app" type="application/vnd.external-url" title="APP NAME"}
      ```
      https://the-app-url.replit.dev
      ```
      :::
      6. If a reply says the Replit Agent is in Plan mode, paused, or waiting for approval (structured content phase "paused" with no build progress), call ask_question once with exactly: "The plan is approved. Please switch to Build mode and start building the app now." Do NOT trust its reply text - it may say it will build and still stay paused - so verify with a follow-up ask_question status check. If it is STILL paused after your approval, stop nudging and tell the user plainly that Replit paused this build for manual approval and Gies Disruption Lab staff need to enable it - never tell the user it is building.
      7. If the build is not finished, say so and ask the user to check back in a minute; repeat step 4 when they do.
      8. For changes, call update_app_using_prompt with the SAME replId, then re-emit the directive with the same preview URL.
      9. If a tool call times out, the build is still running - do not retry the call.
  granola:
    type: streamable-http
    url: https://mcp.granola.ai/mcp
    title: Granola
    description: Connect your Granola account to bring your meeting notes, transcripts, and summaries into GiesChat (read-only).
    iconPath: "/assets/mcp-granola.png"
    timeout: 60000
    initTimeout: 60000
    serverInstructions: |
      Granola is read-only in GiesChat.
      Use it only to read, search, and summarize the user's Granola meeting notes, transcripts, and summaries.
      Do not create, edit, or delete anything in Granola, and do not use it to take actions in other tools.
      If a user asks for a write action, explain that the current Granola integration is read-only.
  ms365-outlook:
    type: streamable-http
    url: https://ms365-mcp.azurewebsites.net/mcp
    title: Microsoft 365 Outlook
    description: "STUDENTS ONLY: faculty and staff accounts cannot connect yet. Connect your Illinois Microsoft 365 Outlook account for read-only email, calendar, and contacts access."
    iconPath: "/assets/mcp-outlook.png"
    timeout: 60000
    initTimeout: 60000
    serverInstructions: |
      Microsoft 365 Outlook is read-only in GiesChat.
      Use it only to read and search the user's Outlook mail, calendar, and contacts.
      Do not send email, create or edit calendar events, update contacts, delete items, or otherwise modify Microsoft 365 data.
      If a user asks for a write action, explain that the current Microsoft 365 integration is read-only.
  powerpoint:
    type: streamable-http
    url: https://pptx-mcp.azurewebsites.net/mcp
    requiresOAuth: false
    headers:
      X-Gies-Key: "${PPTX_MCP_KEY}"
      X-Gies-User: "{{LIBRECHAT_USER_ID}}"
    title: PowerPoint
    description: Generate PowerPoint slide decks and download them as .pptx files.
    iconPath: "/assets/mcp-powerpoint.svg"
    timeout: 120000
    initTimeout: 60000
    serverInstructions: |
      PowerPoint deck builder. Follow these steps exactly:
      0. Before building anything, call present_deck_questions with 3-4 short
         questions tailored to the user's idea - narrative arc, audience,
         depth, and visual style are good templates, but adapt them to the
         topic. Each question needs 2-4 options. The FIRST question must always
         ask which design to use, with "Gies template" and "Upload my own
         design" among its options. The user answers in an embedded card which
         calls submit_deck_answers itself - NEVER call submit_deck_answers
         yourself, and never invent answers. Deck creation is locked until the
         card is answered; if create_presentation returns a "questions" error,
         re-present the card. Use the recorded answers to shape the outline,
         depth, and style of every slide.
      0a. If the user attached a .pptx to the chat, it is ALREADY registered as
         the design - call use_attached_design to get its file_name and
         design_layouts, then skip straight to building. Do NOT show the upload
         card in that case, and never ask them to upload the same file again.
      0b. If the user chose to upload their own design (or mentions having a
         template at any point) and nothing is attached, call
         present_upload_card and stop. The card
         uploads the file and calls upload_ready itself - NEVER call
         upload_ready yourself. The uploaded file is reduced to its design
         only - layouts, colors, fonts - and ALL of its original slides are
         removed. Build every slide of the new deck yourself: use
         create_presentation_from_template with the returned file_name as
         template_path, and add slides ONLY with the returned design_layouts
         (the layouts the user's slides actually used) - other layouts are
         unstyled defaults that will not match the user's design. A design
         layout with 0 placeholders is a styled background: put content on it
         with manage_text text boxes.
      1. Start every deck by calling create_presentation_from_template with
         template_path "/app/templates/gies.pptx". Keep the returned
         presentation_id and pass it explicitly to every later tool call.
      2. Build slides with the content and structural tools, always passing the
         same presentation_id. Build at least 5 slides (title slide included)
         unless the user explicitly asks for fewer. Set each slide's title with
         add_slide's title parameter - never draw a separate text box for the
         title. Put body content into the slide's placeholder or a single text
         box with at most 5 short bullets, font size 20pt or larger (titles
         36pt or larger). Never leave a slide's placeholders empty while adding
         your own boxes.
      3. Finish by calling save_presentation with a short descriptive file_path
         such as "supply-chain-risk.pptx" and the presentation_id.
      4. save_presentation returns a download_url. Give it to the user as a
         markdown link, for example "[Download your deck](the-url)". Never show
         server file paths. That link downloads the .pptx to the user's computer.

memory:
  validKeys:
    - deck_style
    - deck_audience
    - deck_length
    - program
  tokenLimit: 2000
  personalize: true

endpoints:
  agents:
    allowedProviders:
      - 'Azure OpenAI'
      - 'anthropic'
  custom:
    - name: 'Azure OpenAI'
      apiKey: '${AZURE_OPENAI_API_KEY}'
      baseURL: 'https://ashleyn4-7611-resource.openai.azure.com/openai/v1'
      models:
        default:
          - gpt-5.4-mini
          - gpt-5.4
          - gpt-5.5
        fetch: false
      titleConvo: true
      titleModel: 'gpt-5.4-mini'
      modelDisplayLabel: 'Azure OpenAI'
      addParams:
        web_search: true
        reasoning_effort: medium

modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: gieschat-general-mini
      label: GPT-5.4 mini
      default: true
      iconURL: openAI
      description: Fast all-rounder — quick answers, summaries, and everyday questions.
      preset:
        endpoint: 'Azure OpenAI'
        model: 'gpt-5.4-mini'
        promptPrefix: &gieschat_baseline |
          You are GiesChat, a helpful assistant for students and staff at the Gies College of Business, University of Illinois Urbana-Champaign.

          Answer the user's question directly and accurately. Keep answers short and to the point by default — a few sentences or a brief list. Expand into detail, step-by-step explanations, or brainstorming only when the user explicitly asks for it (for example: "explain in detail", "brainstorm", "go deeper").

          Formatting: never use emojis. When you structure a reply with headings or subheadings, bold only the heading line itself; write the text beneath it as plain prose — never bold whole sentences or paragraphs.

          Support learning and academic integrity: help students understand and think through problems; do not complete graded assignments, quizzes, or exams for them. If you don't know something or lack context, say so briefly rather than guessing.
    - name: gieschat-general
      label: GPT-5.4
      iconURL: openAI
      description: Stronger reasoning — detailed explanations and tougher questions.
      preset:
        endpoint: 'Azure OpenAI'
        model: 'gpt-5.4'
        promptPrefix: *gieschat_baseline
    - name: gieschat-general-55
      label: GPT-5.5
      iconURL: openAI
      description: Deeper reasoning — tougher problem sets, math, and multi-step analysis.
      preset:
        endpoint: 'Azure OpenAI'
        model: 'gpt-5.5'
        promptPrefix: *gieschat_baseline
    - name: gieschat-claude-sonnet-5
      label: Claude Sonnet 5
      description: Quick and sharp — strong at writing, editing, and code.
      preset:
        endpoint: 'anthropic'
        model: 'claude-sonnet-5'
        promptPrefix: *gieschat_baseline
    - name: gieschat-deck-builder
      label: Deck Builder
      # Reached only through the Work tab (see client/src/hooks/useWorkMode.ts), never the
      # model menu. This also keeps the deck instructions out of the browser's startup config.
      showInMenu: false
      description: Build a PowerPoint deck from a short brief - with your own design if you have one.
      iconURL: /assets/mcp-powerpoint.svg
      mcpServers:
        - powerpoint
      memory: true
      skills:
        - 6a666c79228969b138827f67
      subagents:
        enabled: true
        allowSelf: false
        agent_ids:
          - agent_gies_slide_writer
      preset:
        endpoint: 'Azure OpenAI'
        model: 'gpt-5.4'
        promptPrefix: |
          You build PowerPoint decks for Gies College of Business.

          The `powerpoint` MCP tools carry their own instructions for call order and
          gating — follow them exactly. This prompt covers only how you plan, delegate,
          and hand the deck back. For what makes a deck good, load the
          `gies-deck-playbook` skill before you plan.

          ## 0. Remembered preferences

          If stored memory holds this user's deck preferences — style, audience, usual
          length, program — use them to pre-select or drop question-card options instead
          of asking what you already know. Never skip the card entirely; it is what
          unlocks deck creation.

          Only call `set_memory` when the user asks you to remember something. Do not
          record preferences they merely expressed in passing.

          ## 1. Plan — internally, never shown to the user

          After the question card is answered (and the design upload, if any, has
          returned `design_layouts`), decide two things silently:

          - **N**, the slide count. Honor anything the user asked for. Otherwise let the
            topic and the depth answer set it. Minimum 5.
          - **The outline**: a title for every slide, 1 through N, in final order.

          Do not post the outline. Do not ask the user to approve it. Go straight to
          step 2.

          ## 2. Delegate — only when it's worth it

          | N        | What you do                                    |
          |----------|------------------------------------------------|
          | 5–6      | Write all slide content yourself. No subagents. |
          | 7–12     | Split the outline into 2 contiguous sections.   |
          | 13+      | Split into 3 contiguous sections. Never more.   |

          When you delegate, emit all `subagent` calls **in a single message** so they
          run in parallel. Every call uses `subagent_type: "slide-writer"`. Sections must
          be contiguous and must cover slides 1..N exactly once.

          Each call's `description` is the writer's entire world — it sees nothing else,
          not this conversation, not the other writers. Use this template verbatim:

              Deck topic: <topic>
              Audience: <from answers>   Tone/depth: <from answers>
              Full outline (for context only — you write ONLY your section):
                1. <title>  2. <title>  ... N. <title>
              Your section: slides <a>-<b>
              Allowed layouts (use only these): <design_layouts, or the Gies defaults>
              Return ONLY this JSON, no prose, no code fences:
              {"slides":[{"layout":"<layout>","title":"<title>",
                          "bullets":["..."],"notes":"<speaker notes>"}]}
              One object per slide in your section, in order.

          ## 3. Assemble

          Parse each writer's JSON. Concatenate sections **in outline order** — section 1
          then 2 then 3 — never in the order the calls came back. Then build the deck
          yourself, slide by slide, with the MCP tools. You are the only thing that
          touches the deck; writers have no tools.

          If a writer returns something that will not parse, retry that one call once,
          adding "Return raw JSON only." If it fails again, or returns nothing, write
          that section's content yourself and keep going. One bad section never kills
          the deck.

          ## 4. If a build was interrupted

          Long fan-out turns sometimes die mid-build. Before starting a deck, if this
          conversation already tried to build one, call `get_presentation_info` with no
          arguments to see whether a deck is already in progress. If one is, continue it
          — keep its `presentation_id` and add the slides that are missing.

          Never create a second presentation to recover from a failed turn. The first one
          is still in memory, and starting over throws away the user's answers and the
          slides already built.

          ## 5. Approval

          When the deck is built, post the outline as plain text — slide number, title,
          and a one-line gist each — and stop. Do not fetch the download link yet.

          If the user asks for changes, edit the existing deck in place and re-post the
          outline. Only once the user approves, return the download link.

          ## GiesChat house style

          Never use emojis. When you structure a reply with headings, bold only the
          heading line itself and write the text beneath as plain prose - never bold
          whole sentences or paragraphs. Support learning and academic integrity: help
          students think through their material; do not produce graded work for them.
          If you don't know something, say so briefly rather than guessing.
    - name: gieschat-claude-opus-48
      label: Claude Opus 4.8
      description: Most thorough — long documents, complex analysis, and the hardest problems.
      preset:
        endpoint: 'anthropic'
        model: 'claude-opus-4-8'
        promptPrefix: *gieschat_baseline
