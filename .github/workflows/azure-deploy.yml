name: Deploy GiesChat to Azure

on:
  push:
    branches: [main, staging]
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'docs/site/**'
      - 'librechat.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch: {}

# Per-branch, so a staging deploy never cancels a production one mid-flight.
concurrency:
  group: gieschat-azure-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: dlacrgieschat.azurecr.io
  IMAGE_NAME: dlacrgieschat.azurecr.io/gieschat/api
  WEBAPP_NAME: gieschat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Surfaces the deployed URL on the run and in the repo's Deployments view, so
    # "what is on staging right now" is answerable without opening Azure.
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      url: ${{ github.ref_name == 'staging' && 'https://gieschat-staging.azurewebsites.net' || 'https://gieschat.azurewebsites.net' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `latest` tracks production only — a staging build must never move the tag
          # a human would reach for when asking "what is live?".
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One deploy step for both environments so the staging path cannot drift from
      # production's. The publish profile alone selects the target: the staging secret
      # carries msdeploySite="gieschat__staging", the production one "gieschat".
      #
      # Do NOT add `slot-name` here. It looks like it belongs, but with publish-profile
      # auth it forces an ARM lookup the action cannot make, and the deploy dies with
      # the unhelpful "Failed to get app runtime OS".
      - name: Deploy image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: >-
            ${{ github.ref_name == 'staging'
                && secrets.AZURE_WEBAPP_STAGING_PUBLISH_PROFILE
                || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Report target
        run: |
          echo "branch:  ${{ github.ref_name }}"
          echo "slot:    ${{ github.ref_name == 'staging' && 'staging' || 'production' }}"
          echo "note:    slot is selected by the publish profile, not a slot-name input"
          echo "url:     ${{ github.ref_name == 'staging' && 'https://gieschat-staging.azurewebsites.net' || 'https://gieschat.azurewebsites.net' }}"
          echo "image:   ${{ env.IMAGE_NAME }}:${{ github.sha }}"
